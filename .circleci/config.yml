version: 2
jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.6-node
        environment:
          RAILS_ENV: test
          AWS_DEFAULT_REGION: us-west-2
          EB_APP_NAME: ingest
          # prevents sql commands in db:structure:load from piping to
          # less and waiting for interactive
          # input. https://stackoverflow.com/a/53055116/14487
          PAGER: cat
      - image: safecast/postgres:16.1
        environment:
          POSTGRES_USER: safecast
          POSTGRES_DB: safecast
          POSTGRES_PASSWORD: safecast
      - image: docker.elastic.co/elasticsearch/elasticsearch:8.14.2
        environment:
          discovery.type: single-node
    steps:
      - checkout
      - run:
          name: Install build tools
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client python3 python3-pip
            pip install --upgrade pip
            pip install awsebcli==3.21.0 awscli==1.35.7
            gem install bundler:2.5.21
      - restore_cache:
          keys:
            - ingest-{{ .Environment.CACHE_VERSION }}-{{ checksum "Gemfile.lock" }}
      - run:
          name: Bundle Install
          command: bundle install --path vendor/bundle
      - save_cache:
          key: ingest-{{ .Environment.CACHE_VERSION }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Wait for postgres
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Wait for elasticsearch
          command: dockerize -wait tcp://localhost:9200 -timeout 1m
      - run:
          name: Configure database
          command: cp config/database.yml.ci config/database.yml
      - run:
          name: Load schema
          command: |
            bundle exec rake db:setup
      - run:
          name: Run rspec
          command: |
            bundle exec rspec --profile 10 \
                              --format RspecJunitFormatter \
                              --out test_results/rspec.xml \
                              --format progress \
                              $(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)
      - store_test_results:
          path: test_results
      - run:
          name: Create application version
          command: |
            ./.elasticbeanstalk/package.sh
